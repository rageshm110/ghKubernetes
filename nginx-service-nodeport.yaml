apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport-service # Renamed for clarity
spec:
  selector:
    app: nginx-with-service
  ports:
    - protocol: TCP
      port: 8085
      targetPort: 80 
      nodePort: 30007 # Optional: You can specify a port (30000-32767). If omitted, Kubernetes picks one.
  type: NodePort
---